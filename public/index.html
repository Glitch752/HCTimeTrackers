<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiba Time Tracker</title>
    <link rel="icon" href="https://shiba.hackclub.com/favicon.ico">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #090909;
            text-align: center;
            color: #e9e9e9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            overflow: hidden;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            margin: 0;
        }

        .panel-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 2rem;
        }

        .panel {
            background-color: #191919;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            width: 250px;
            position: relative;
            padding-bottom: 15px;
        }
        .panel .title {
            display: block;
            font-size: 1.1rem;
            margin: 10px;
        }
        .panel .value {
            font-size: 2em;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>
    <h1>Hack Club Time Trackers</h1>

    <div class="panel-row">
        <a class="panel" href="/shiba">
            <span class="title">shiba.hackclub.com</span>
            <div class="value">Shiba</div>
        </a>
        <a class="panel" href="/milkyway">
            <span class="title">milkyway.hackclub.com</span>
            <div class="value">Milkyway</div>
        </a>
    </div>
</body>
</html>
